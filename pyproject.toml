[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cntryl-fitz"
version = "0.0.1"
description = "Async-first Python client for Fitz"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Cntryl" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Distributed Computing",
]
keywords = ["fitz", "distributed-systems", "asyncio", "websocket", "tcp", "rpc"]
dependencies = [
  "websockets>=13,<16",
]

[project.urls]
Homepage = "https://github.com/cntryl/fitz-py"
Repository = "https://github.com/cntryl/fitz-py"
Issues = "https://github.com/cntryl/fitz-py/issues"

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "hypothesis>=6.130,<7",
  "ruff>=0.13,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "pyright>=1.1.400,<2",
  "pyperf>=2.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fitz_py"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/benchmarks",
  "/README.md",
  "/LICENSE",
  "/MIGRATION.md",
  "/PERFORMANCE.md",
  "/AUDIT_REMEDIATION.md",
  "/pyproject.toml",
]
exclude = ["/.hypothesis", "/artifacts", "/dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.envs.default.scripts]
build = "python -m build"
format = "ruff format --check ."
lint = "ruff check ."
test-unit = "pytest tests/unit"
test-integration = "pytest tests/integration -v"
test-conformance = "pytest tests/conformance -v"
test-spec = "pytest tests/conformance -v"
bench-hotpath = "python -m benchmarks.hotpath"
verify = "ruff format --check . && ruff check . && pytest tests/unit && pytest tests/integration -v && pytest tests/conformance -v"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["artifacts", "dist"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ASYNC109", # Timeout is an intentional part of these async APIs.
  "C901",     # State-machine complexity is covered by branch tests.
  "COM812",   # Conflicts with Ruff's formatter.
  "CPY",      # The repository license applies without per-file banners.
  "D",        # Public API documentation is maintained in the reference docs.
  "EM",
  "FBT",
  "PLR",
  "PLC0415",  # Optional transports are imported lazily.
  "PYI034",
  "S311",     # Jitter is non-cryptographic.
  "TC",
  "TRY003",   # Domain exceptions intentionally carry operation-specific messages at raise sites.
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**" = ["T201"]
"tests/**" = ["ANN", "ARG", "INP", "PT", "RUF006", "S", "SIM105", "SLF", "T201"]
"tests/conformance/test_conformance.py" = ["BLE"] # Scenarios record unexpected failures.
"tests/integration/fixture/fixture.py" = ["BLE"] # Any connection failure makes the broker unavailable.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportPrivateUsage = false
reportUnsupportedDunderAll = false
reportMissingImports = false
