[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cntryl-fitz"
version = "0.1.0"
description = "Async-first Python client for Fitz"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Cntryl" }
]
dependencies = [
  "websockets>=12,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fitz_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
