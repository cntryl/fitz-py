[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cntryl-fitz"
version = "0.1.0"
description = "Async-first Python client for Fitz"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Cntryl" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Distributed Computing",
]
keywords = ["fitz", "distributed-systems", "asyncio", "websocket", "tcp", "rpc"]
dependencies = [
  "websockets>=12,<16",
]

[project.urls]
Homepage = "https://github.com/cntryl/fitz-py"
Repository = "https://github.com/cntryl/fitz-py"
Issues = "https://github.com/cntryl/fitz-py/issues"

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "ruff>=0.13,<0.14",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fitz_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.envs.default.scripts]
build = "python -m build"
lint = "ruff check ."
test-unit = "pytest tests/unit"
test-conformance = "pytest tests/conformance -v"
test-spec = "pytest tests/conformance -v"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
